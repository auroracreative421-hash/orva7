<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORVA 7 | لوحة تحكم المتجر</title>
    <meta name="description" content="لوحة الإدارة الخاصة لمتجر ORVA 7 للأزياء الفاخرة." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
  </head>
  <body class="admin-body">
    <div id="admin-root">
      <div class="admin-auth-loading">
        <div class="spinner"></div>
        <p>جارٍ التحقق من الجلسة...</p>
      </div>
    </div>

    <dialog id="admin-modal" class="admin-modal" aria-labelledby="admin-modal-title">
      <div class="admin-modal-card">
        <div class="admin-modal-header">
          <h2 id="admin-modal-title"></h2>
          <button type="button" id="admin-modal-close" class="icon-btn" aria-label="إغلاق النافذة">
            ✕
          </button>
        </div>
        <div id="admin-modal-body" class="admin-modal-body"></div>
      </div>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <script type="module" src="/src/js/admin.js"></script>
  </body>
</html>
